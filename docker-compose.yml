services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build: ./backend
    command: sh -c "python manage.py makemigrations core && python manage.py migrate && python manage.py seed_demo"
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend1:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
      POSTGRES_HOST: postgres
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]

  backend2:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
      POSTGRES_HOST: postgres
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend1, backend2]

volumes:
  postgres_data:
