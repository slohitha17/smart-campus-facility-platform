upstream campus_api { least_conn; server backend1:8000; server backend2:8000; }
server { listen 80; server_name _; root /usr/share/nginx/html; index index.html;
 location /api/ { proxy_pass http://campus_api/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location /admin/ { proxy_pass http://campus_api/admin/; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
